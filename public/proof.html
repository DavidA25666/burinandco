<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your proof · Burin & Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ops.css">
<style>
  .proof { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2rem, 5vw, 4rem); align-items: start; }
  /* The proof, framed the way FinerWorks builds it: 2" moulding, 1.5" Snow White 4-ply mat with a
     bevelled window. --fw and --mw are set from the real size once the image loads (16x12 shown by default). */
  .pf { container-type: inline-size; width: 100%; max-width: 560px; }
  .pf-frame { --fw: 8.7cqw; --mw: 6.5cqw; --wood: #4b2e1c; position: relative; padding: var(--fw); background: var(--wood);
    box-shadow: 0 3cqw 5cqw -2cqw rgba(0,0,0,.5), 0 .8cqw 1.6cqw rgba(0,0,0,.22); }
  .pf-frame.ebony { --wood: #1e1b18; }
  .pf-side { position: absolute; display: block;
    background:
      linear-gradient(var(--light), var(--light)),
      linear-gradient(var(--dir), rgba(0,0,0,.55) 0, rgba(0,0,0,.12) 5%, rgba(255,255,255,.2) 13%, rgba(255,255,255,.06) 28%, rgba(0,0,0,.04) 48%, rgba(0,0,0,.2) 74%, rgba(0,0,0,.1) 80%, rgba(255,255,255,.2) 85%, rgba(255,255,255,.08) 89%, rgba(0,0,0,.6) 100%),
      repeating-linear-gradient(var(--grain), rgba(0,0,0,.10) 0 1px, transparent 1px 3px, rgba(255,255,255,.035) 3px 4px, transparent 4px 7px),
      repeating-linear-gradient(calc(var(--grain) + 1.2deg), rgba(0,0,0,.07) 0 2px, transparent 2px 13px),
      var(--wood); }
  .pf-side.t { top: 0; left: 0; right: 0; height: var(--fw); --dir: to bottom; --grain: 0deg; --light: rgba(255,255,255,.07);
    clip-path: polygon(0 0, 100% 0, calc(100% - var(--fw)) 100%, var(--fw) 100%); }
  .pf-side.b { bottom: 0; left: 0; right: 0; height: var(--fw); --dir: to top; --grain: 0deg; --light: rgba(0,0,0,.2);
    clip-path: polygon(var(--fw) 0, calc(100% - var(--fw)) 0, 100% 100%, 0 100%); }
  .pf-side.l { top: 0; bottom: 0; left: 0; width: var(--fw); --dir: to right; --grain: 90deg; --light: rgba(255,255,255,0);
    clip-path: polygon(0 0, 100% var(--fw), 100% calc(100% - var(--fw)), 0 100%); }
  .pf-side.r { top: 0; bottom: 0; right: 0; width: var(--fw); --dir: to left; --grain: 90deg; --light: rgba(0,0,0,.12);
    clip-path: polygon(0 var(--fw), 100% 0, 100% 100%, 0 calc(100% - var(--fw))); }
  .pf-mat { position: relative; padding: var(--mw); background: linear-gradient(165deg, #fcfbf8, #f2f0ea);
    box-shadow: inset .5cqw .7cqw 1.2cqw rgba(0,0,0,.32), inset 0 0 0 1px rgba(0,0,0,.25); }
  /* The 4-ply bevel: a white core cut at 45°, in shade along the top, catching the light along the bottom. */
  .pf-window { position: relative; border: .7cqw solid; border-color: #d9d5ca #e9e6de #ffffff #f4f2ec;
    box-shadow: 0 0 0 1px rgba(0,0,0,.07); }
  .pf-window::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.2), inset .25cqw .35cqw .6cqw rgba(0,0,0,.16); }
  .pf-window img { display: block; width: 100%; height: auto; }
  .pf-glass { position: absolute; inset: var(--fw); pointer-events: none;
    background: linear-gradient(118deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.06) 42%, rgba(255,255,255,0) 58%); }
  .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1.5rem 0; }
  #change-box { display: none; margin-top: 1rem; }
  #change-box.open { display: block; }
  .done { border-left: 3px solid var(--brass); padding-left: 1rem; }
  @media (max-width: 860px) { .proof { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="site-head"><div class="wrap"><a class="brand" href="/">Burin &amp; Co.</a></div></header>
<main><section style="background:var(--wall)"><div class="wrap proof">
  <div class="pf"><div class="pf-frame walnut" id="frame">
    <i class="pf-side t"></i><i class="pf-side r"></i><i class="pf-side b"></i><i class="pf-side l"></i>
    <div class="pf-mat"><div class="pf-window"><img id="render" alt="Your portrait proof" oncontextmenu="return false" draggable="false"></div></div>
    <span class="pf-glass"></span>
  </div></div>
  <div id="panel"><p>Loading your proof…</p></div>
</div></section></main>

<script>
(() => {
  const p = new URLSearchParams(location.search);
  const o = p.get("o"), t = p.get("t");
  const panel = document.getElementById("panel");
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  function finished(html) { panel.innerHTML = `<div class="done">${html}</div>`; }

  async function respond(action, note) {
    const res = await fetch("/api/proof", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ o, t, action, note }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "That didn't go through. Try again in a moment.");
    return data;
  }

  // Meta Pixel Purchase, once per order (consent.js sends it only if cookies were accepted).
  function firePurchase(pu) {
    if (!pu || !window.bcTrack) return;
    const key = "bc_px_" + pu.eventId;
    try { if (localStorage.getItem(key)) return; localStorage.setItem(key, "1"); } catch (e) { /* private mode */ }
    window.bcTrack("Purchase", { content_type: "product", content_ids: [pu.size], currency: pu.currency, value: pu.value, num_items: 1 }, pu.eventId);
  }

  const sid = p.get("session_id");
  const returned = sid
    ? fetch("/api/checkout-return", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: sid }) }).catch(() => {})
    : Promise.resolve();
  returned.then(() => fetch(`/api/proof?o=${encodeURIComponent(o || "")}&t=${encodeURIComponent(t || "")}`))
    .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.error); return d; })
    .then((d) => {
      firePurchase(d.purchase);
      const frame = document.getElementById("frame");
      frame.className = `pf-frame ${d.frame === "Black oak" ? "ebony" : "walnut"}`;
      const img = document.getElementById("render");
      // True proportions: the frame is 3" larger than the print (1.5" of mat a side) plus a 2" moulding.
      img.onload = () => {
        const dims = (d.size.match(/\d+(\.\d+)?/g) || []).map(Number);
        if (dims.length < 2) return;
        const printW = img.naturalWidth >= img.naturalHeight ? Math.max(...dims) : Math.min(...dims);
        const outerW = printW + 3 + 4;
        frame.style.setProperty("--fw", `${(200 / outerW).toFixed(2)}cqw`);
        frame.style.setProperty("--mw", `${(150 / outerW).toFixed(2)}cqw`);
      };
      if (d.renderUrl) img.src = d.renderUrl;
      const intro = `<h1>Your ${esc(d.subject || "portrait")}, ready for review.</h1>
        <p class="lede">${esc(d.style)}, ${esc(d.size)}, ${esc(d.frame.toLowerCase())} frame${d.updatedFromNotes ? ". Updated with your notes." : "."}</p>`;
      if (!d.awaitingResponse) {
        panel.innerHTML = intro + `<p class="done">Thanks, we have your response to this proof. We'll email you if anything else is needed.</p>`;
        return;
      }
      const price = "$" + (d.price / 100).toLocaleString("en-US");
      const plaque = d.plaque && d.plaque[0] ? ` and check the spelling of your plaque: <strong>${esc(d.plaque[0])}${d.plaque[1] ? " / " + esc(d.plaque[1]) : ""}</strong>` : "";
      const caption = d.caption ? `, and check the spelling of the line under the art: <strong>${esc(d.caption.toUpperCase())}</strong>` : "";
      if (d.paymentDue) {
        panel.innerHTML = intro + `
          <p>You approved this proof, but your saved card didn't go through. Complete payment of ${price} and we'll send it to print.</p>
          <div class="actions"><button class="btn" id="approve">Complete payment</button></div>
          <p class="form-error" id="err" role="alert"></p>`;
      } else {
      panel.innerHTML = intro + `
        <p>Look closely at every badge, line and window${plaque}${caption}. The watermark is only on this preview; your print is clean, full resolution and on cotton rag.</p>
        <p>${d.prepaid ? "Once you approve, we print, frame and ship it." : `When you approve, we charge the card you saved, ${price}, and then print, frame and ship it. Asking for changes costs nothing.`}</p>
        <div class="actions">
          <button class="btn" id="approve">${d.prepaid ? "Approve and print" : `Approve and pay ${price}`}</button>
          <button class="btn secondary" id="change">Request a change</button>
        </div>
        <div id="change-box">
          <label for="note" class="label">What should we change?</label>
          <textarea id="note" maxlength="1000" placeholder="For example: the wheels should have five spokes, and the side mirrors are black, not chrome."></textarea>
          <div class="actions"><button class="btn" id="send-change">Send my notes</button></div>
        </div>
        <p class="form-error" id="err" role="alert"></p>`;
      }
      const err = document.getElementById("err");
      const changeBtn = document.getElementById("change");
      if (changeBtn) changeBtn.onclick = () => { document.getElementById("change-box").classList.add("open"); document.getElementById("note").focus(); };
      document.getElementById("approve").onclick = async (e) => {
        e.target.disabled = true; err.textContent = "";
        try {
          const r = await respond("approve");
          if (r.checkoutUrl) { location.href = r.checkoutUrl; return; }
          firePurchase(r.purchase);
          finished(`<h2>Approved. Thank you!</h2><p>${d.prepaid ? "" : `We've charged ${price} to your saved card. `}Your portrait goes to print next. We'll email tracking details when it ships.</p>`);
        }
        catch (ex) { err.textContent = ex.message; e.target.disabled = false; }
      };
      const sendBtn = document.getElementById("send-change");
      if (sendBtn) sendBtn.onclick = async (e) => {
        const note = document.getElementById("note").value.trim();
        if (!note) { err.textContent = "Tell us what you'd like changed."; return; }
        e.target.disabled = true; err.textContent = "";
        try { await respond("changes", note); finished("<h2>Got it. We're on it.</h2><p>We'll email you an updated proof, usually within one business day.</p>"); }
        catch (ex) { err.textContent = ex.message; e.target.disabled = false; }
      };
    })
    .catch((ex) => { panel.innerHTML = `<h1>Proof not found</h1><p>${esc(ex.message || "This proof link isn't valid.")}</p>`; });
})();
</script>
<script src="/consent.js"></script>
</body>
</html>
